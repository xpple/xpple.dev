name: Build distributable version
on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Config
      run: |
        git config --local user.email "fred@xpple.dev"
        git config --local user.name "Frederik van der Els"

    - name: Remove unwanted files
      run: rm -rf .github .idea .vscode node_modules .gitignore package.json package-lock.json tsconfig.json

    - name: Commit
      run: |
        git add -A -f
        git commit -a -m "Update build branch"

    - name: Publish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: git push --force origin HEAD:dist
